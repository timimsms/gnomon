name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded run tells us nothing; cancel it rather than pay for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest

    # The tenancy suite proves tenant A cannot read tenant B's events, and it
    # cannot run against a mock -- nor against a superuser connection, which
    # would pass while proving nothing. A service container gives CI a real
    # Postgres without needing a Docker daemon on anyone's laptop, which is the
    # whole point of the URL-based harness (ADR-0010).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      GNOMON_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Pinned to the range the workspace declares. The server package
          # requires a higher floor; that is enforced by its own `engines`
          # field, not here.
          node-version: 22
          cache: pnpm

      # The Go reference implementation in examples/token-minting is verified
      # against the real token verifier. Without a toolchain that suite skips,
      # and a skipped example is an unverified example -- so the test itself
      # fails when Go is missing under CI rather than passing quietly.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          # No go.sum -- the reference implementation is stdlib-only -- and
          # setup-go warns on every run when it cannot find one.
          cache: false

      # --frozen-lockfile: a PR that changes dependencies must commit the
      # lockfile change, so the licence gate below inspects what will actually
      # be installed rather than a fresh resolution.
      - run: pnpm install --frozen-lockfile

      # Licences run before typecheck and tests, per CONTRIBUTING.md. A
      # copyleft dependency is a licensing incident, not a test failure, and
      # should fail before anything slower runs.
      - name: Licence compliance (ADR-0002)
        run: pnpm lint:licenses

      - name: Typecheck
        run: pnpm typecheck

      # The adapter conformance suite runs in a real browser: both renderers
      # measure layout, and a DOM that does not lay out would let an adapter
      # pass while drawing nothing. Chromium only -- the suite proves the
      # RENDERER seam, not browser compatibility, which is phase 4.8's job.
      - name: Install Playwright Chromium
        run: pnpm --filter @gnomon/embed exec playwright install --with-deps chromium

      # The hostile-host suite runs a real Gnomon server and a real portal on
      # two origins, so it needs its own browser install in that package too.
      - name: Install Playwright Chromium (demo-portal)
        run: pnpm --filter @gnomon/demo-portal exec playwright install chromium

      # Includes scripts/check-licenses.test.mjs, which proves the gate above
      # rejects AGPL/GPL and fails closed on unknown licences. A gate never
      # observed to reject anything is not a gate.
      - name: Test
        run: pnpm test
